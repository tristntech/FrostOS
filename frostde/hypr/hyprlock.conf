# FrostDE lock screen (hyprlock). Wallpaper, big clock, password field.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = /usr/share/backgrounds/frostos/frost-light.png
    blur_passes = 3
    blur_size = 8
    brightness = 0.75
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = rgba(248, 252, 255, 0.95)
    font_size = 22
    font_family = Inter
    position = 0, 330
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%-H:%M"
    color = rgba(248, 252, 255, 0.98)
    font_size = 110
    font_family = Inter
    position = 0, 220
    halign = center
    valign = center
}

image {
    monitor =
    path = /usr/share/icons/hicolor/scalable/apps/frostos.svg
    size = 84
    rounding = -1
    border_size = 0
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(248, 252, 255, 0.95)
    font_size = 16
    font_family = Inter
    position = 0, -110
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 240, 38
    outline_thickness = 0
    rounding = 19
    inner_color = rgba(255, 255, 255, 0.22)
    font_color = rgb(255, 255, 255)
    font_family = Inter
    placeholder_text = Enter Password
    fade_on_empty = false
    dots_center = true
    check_color = rgb(85, 175, 255)
    fail_color = rgb(255, 95, 87)
    fail_text = Wrong password
    position = 0, -170
    halign = center
    valign = center
}
